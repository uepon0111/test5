<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鉄道シミュレーター</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<canvas id="gl"></canvas><canvas id="c"></canvas>
<div id="ui">
  <div id="bar" class="panel">
    <div class="brand" data-i="trn"><span>鉄道シミュレーター</span></div>
    <div class="grp" id="tg">
      <button data-tool="sel" data-i="sel" title="操作 (V)"><span class="lbl">操作</span></button>
      <button data-tool="lay" data-i="lay" title="線路を敷く (L)"><span class="lbl">敷設</span></button>
      <button data-tool="sta" data-i="sta" title="駅を置く (S)"><span class="lbl">駅</span></button>
      <button data-tool="erase" data-i="era" title="削除 (E)"><span class="lbl">削除</span></button>
      <button data-tool="train" data-i="trn" title="列車: 追加・ダイヤ設定 (T)"><span class="lbl">列車</span></button>
      
    </div>
    <div class="grp">
      <button id="undo" data-i="undo" title="元に戻す (Ctrl+Z)"><span class="lbl">戻す</span></button>
      <button id="play" title="再生 / 停止 (Space)"></button>
      <label class="spd"><span class="lbl">速度</span><input id="spd" type="range" min="1" max="10" step=".5" value="3" title="時間の進む速さ (1マスの走行=20秒)"></label><input id="clk" type="time" step="1" title="現在時刻 (変更できます)" aria-label="現在時刻">
    </div>
    </div>
  <div id="map">
    <div id="tl" class="panel zbtn"><button id="zo" data-i="minus" title="縮小" aria-label="縮小"></button><button id="zi" data-i="plus" title="拡大" aria-label="拡大"></button></div>
    <div id="tr" class="panel"><button id="home" data-i="home" title="原点に戻る" aria-label="原点に戻る"></button><button id="v3" data-i="cube" title="擬似3D表示 (3)" aria-label="3D表示"></button><button id="clr" class="danger" data-i="trash" title="すべて削除" aria-label="すべて削除"></button></div>
  </div>
  <div id="dia" class="panel" hidden role="dialog" aria-label="列車">
    <div class="dtop"><div class="dh"><b data-i="trn">列車</b><div><button id="dfit" data-i="fit" title="経路全体を地図に表示"><span>経路全体</span></button><button id="dmin" data-i="minus" title="パネルを畳んで地図を広く見る"><span>畳む</span></button><button id="dx" data-i="x" title="閉じる (Esc)"></button></div></div>
    <div id="ttabs" role="tablist"><button data-tab="add" class="on">追加</button><button data-tab="set">ダイヤ設定</button><button data-tab="gr">ダイヤグラム</button></div></div><ol id="tlist" aria-label="列車の一覧"></ol><div class="dr" id="tact"><span id="tsel"></span><div><button id="tren" data-i="edit">名前変更</button><button id="tdel" class="danger" data-i="trash">削除</button></div></div><p id="aview" class="dn">追加した列車は上の一覧に並びます。「ダイヤ設定」で運行を決められます。</p><div class="dr" id="aview2"><label>追加する列車の編成<input id="anc" class="tn" type="number" min="1" max="12" step="1" value="4" aria-label="追加する列車の両数">両 <small>(1両=1マス)</small></label></div><p id="nosel" class="dn" hidden>列車がありません。「追加」を選び、線路の上に列車を置いてください。</p><div class="dr st"><label>停車時間<input id="dw" type="number" min="0" max="600" step="5">秒</label><button id="dflip" data-i="swap">向き反転</button></div><div class="dr st"><label>編成<input id="dnc" class="tn" type="number" min="1" max="12" step="1" aria-label="両数">両 <small>(1両=1マス)</small></label></div><div class="dr st"><label>繰り返し間隔<input id="dh" class="tn" type="number" min="0" max="23" step="1" aria-label="時間">時間<input id="dm" class="tn" type="number" min="0" max="59" step="1" aria-label="分">分</label></div><div class="dr st"><label>複製<input id="dcm" class="tn" type="number" min="1" max="1439" step="1" value="10" aria-label="何分後">分後に走らせる</label><button id="dclone" data-i="plus">複製</button></div><p id="dpar" class="dn st" hidden></p><p id="dinfo" class="dn st"></p>
    <details class="st" id="dleg"><summary>凡例</summary><p class="dn"><span><i class="chip" style="background:#f08c1a;height:8px"></i>通る経路</span><span><i class="chip" style="background:#2f7de1;"></i>停車</span><span><i class="chip" style="background:#8e44ad;"></i>折返</span><span><i class="chip" style="background:#7b8794;"></i>通過</span><span><i class="chip" style="background:#d6336c;"></i>分岐</span><span><i class="chip" style="background:#e9f8f1;border:2px solid #1fa971;height:10px"></i>次に着く項目</span><span><i class="chip" style="background:#fff;border:2px solid #1f2d3d;height:10px"></i>選択中</span><span>点線の行=ループの前後</span><span>行をタップ/操作で地図の中心に表示</span></p></details>
    <ol id="dlist" class="st"></ol>
    <div id="gv" hidden><div class="dr"><label>表示範囲 (現在から)<select id="gspan"><option value="1800">30分</option><option value="3600" selected>1時間</option><option value="7200">2時間</option><option value="14400">4時間</option></select></label></div><canvas id="gcv"></canvas><div id="glg"></div><p class="dn">横軸=時刻 / 縦軸=駅 / 太いオレンジ=選択中の列車 / 凡例をタップで列車を切替</p></div>
  </div>
  <div id="dock">
    <div id="selp" class="panel" hidden>
      <span id="sinfo"></span><span id="pst" class="stp" hidden>ホーム<button id="pm" aria-label="ホームを減らす">−</button><b id="pcn">1</b><button id="pp" aria-label="ホームを増やす">＋</button></span><div id="psd" class="stp" hidden></div>
      <div class="acts"><button id="sdia" class="pri" data-i="clock"><span>ダイヤ</span></button>
      <button id="sact" data-i="swap"><span id="sactl"></span></button>
      <button id="sren" data-i="edit"><span>名前</span></button>
      <button id="sdel" class="danger" data-i="trash">削除</button>
      <button id="sx" data-i="x">解除</button></div>
    </div>
    <div id="act" class="panel" hidden>
      <b>敷設中</b>
      <button id="ok" class="pri" data-i="check" hidden>確定</button>
      <button id="done" data-i="flag">終了</button>
    </div>
  </div>
  <div id="foot"><div id="hint" class="panel"></div><div id="pos" class="panel"></div></div>
</div>
<script src="js/01-icons.js"></script>
<script src="js/02-state.js"></script>
<script src="js/03-track.js"></script>
<script src="js/04-storage.js"></script>
<script src="js/05-laying.js"></script>
<script src="js/06-geometry.js"></script>
<script src="js/07-trains.js"></script>
<script src="js/08-stations.js"></script>
<script src="js/09-train-tools.js"></script>
<script src="js/10-routing.js"></script>
<script src="js/11-simulation.js"></script>
<script src="js/12-diagram.js"></script>
<script src="js/13-dialog.js"></script>
<script src="js/14-system.js"></script>
<script src="js/15-webgl.js"></script>
<script src="js/16-render.js"></script>
<script src="js/17-input.js"></script>
<script src="js/18-ui.js"></script>
<script src="js/19-main.js"></script>
<script>/* 読み込み確認: js/ が読めないとき(zipを展開せずに開いた等)に原因を表示する */
if(!['rebuild','load','lay','nearEdge','addTrainAt','platPlan','go','step','gDraw','dRender','fail','glDraw','draw','click','setTool','resize'].every(function(n){return typeof window[n]==='function'}))document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:0;z-index:99;margin:0;padding:24px;background:#fff;color:#d9382f;font:16px/1.7 sans-serif">js フォルダのファイルを読み込めませんでした。zip を展開し、フォルダ構成を保ったまま index.html を開いてください。</p>');
</script>
</body>
</html>
