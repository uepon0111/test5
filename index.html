<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2563EB">
  <title>音楽プレイヤー</title>

  <!-- Google Fonts: Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- App CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/log.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    /* Loading screen */
    #app-loader {
      position: fixed; inset: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
    }
    #app-loader .loader-logo {
      width: 56px; height: 56px;
      background: #2563EB;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    #app-loader p { font-size: 0.85rem; color: #64748B; font-family: sans-serif; }

    /* Ensure playlist-area fills player screen */
    #screen-player.active { min-height: 0; }
    #playlist-area { min-height: 0; overflow: hidden; }
    #player-song-list { flex: 1; min-height: 0; overflow-y: auto; }

    /* Player widget drag-close handle in portrait */
    .pw-drag-handle {
      width: 40px; height: 4px;
      background: var(--c-border-strong);
      border-radius: 2px;
      margin: 12px auto 0;
      flex-shrink: 0;
      cursor: grab;
    }

    /* Editor sub-screens: display handled by editor.css .editor-sub-screen */
    /* Log / settings content */
    #screen-log.active, #screen-settings.active { display: flex; flex-direction: column; }

    /* Mini player img/svg toggle */
    .mp-thumb img { display: none; }
    .mp-thumb.has-thumb img { display: block; }
    .mp-thumb.has-thumb svg { display: none; }
  </style>
</head>
<body>

<!-- Loading screen -->
<div id="app-loader">
  <div class="loader-logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
    </svg>
  </div>
  <div class="spinner"></div>
  <p>読み込み中...</p>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="screen-player">

  <!-- ========== Navigation (1) ========== -->
  <nav id="main-nav">
    <div class="nav-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
    <button class="nav-btn active" data-screen="player">
      <svg data-lucide="music" width="20" height="20"></svg>
      <span>プレイヤー</span>
    </button>
    <button class="nav-btn" data-screen="editor">
      <svg data-lucide="edit-3" width="20" height="20"></svg>
      <span>情報編集</span>
    </button>
    <button class="nav-btn" data-screen="log">
      <svg data-lucide="bar-chart-2" width="20" height="20"></svg>
      <span>ログ</span>
    </button>
    <button class="nav-btn" data-screen="settings">
      <svg data-lucide="settings" width="20" height="20"></svg>
      <span>設定</span>
    </button>
  </nav>

  <!-- ========== Player Widget (2) ========== -->
  <!-- In landscape: inline panel between nav and content (visible only on player screen) -->
  <!-- In portrait: position:fixed bottom sheet overlay -->
  <div id="player-widget">
    <!-- Portrait drag handle -->
    <div class="pw-drag-handle"></div>

    <!-- Album art -->
    <div id="pw-art-wrap" class="pw-art-wrap">
      <div id="pw-art-bg" class="pw-art-bg"></div>
      <img id="pw-art" class="pw-art" src="" alt="" style="display:none">
      <div id="pw-art-placeholder" class="pw-art-placeholder">
        <svg data-lucide="music" width="48" height="48"></svg>
      </div>
    </div>

    <!-- Song info -->
    <div class="pw-info">
      <div id="pw-title" class="pw-title">曲が選択されていません</div>
      <div id="pw-artist" class="pw-artist"></div>
    </div>
    <div id="pw-idle" style="padding:0 16px 2px;font-size:0.78rem;color:var(--c-text-300);text-align:center"></div>

    <!-- Seek bar -->
    <div class="pw-seek-wrap">
      <input type="range" id="pw-seek" class="pw-seek" min="0" max="100" value="0" step="0.1">
      <div class="pw-times">
        <span id="pw-time-current">0:00</span>
        <span id="pw-time-total">0:00</span>
      </div>
    </div>

    <!-- Playback controls -->
    <div class="pw-controls">
      <button class="btn-icon" id="btn-shuffle" data-tooltip="シャッフル">
        <svg data-lucide="shuffle"></svg>
      </button>
      <button class="btn-icon lg" id="btn-prev" data-tooltip="前の曲">
        <svg data-lucide="skip-back"></svg>
      </button>
      <button class="btn-icon xl pw-btn-play" id="pw-btn-play-pause" data-tooltip="再生 / 停止">
        <svg data-lucide="play"></svg>
      </button>
      <button class="btn-icon lg" id="btn-next" data-tooltip="次の曲">
        <svg data-lucide="skip-forward"></svg>
      </button>
      <button class="btn-icon" id="btn-loop" data-tooltip="リピート">
        <svg data-lucide="repeat"></svg>
      </button>
    </div>

    <!-- Playback rate -->
    <div class="pw-rate-row">
      <button class="btn-rate" id="btn-rate">
        <span id="btn-rate-label">1.0x</span>
      </button>
    </div>
  </div><!-- /#player-widget -->

  <!-- ========== Main Content (screens) ========== -->
  <main id="main-content">

    <!-- ---- Player Screen ---- -->
    <div id="screen-player" class="screen active">
      <div id="playlist-area">

        <!-- Header row: search (4) + new playlist (5) + add files (6) -->
        <div class="playlist-header">
          <div class="search-bar">
            <svg data-lucide="search"></svg>
            <input type="text" id="player-search" placeholder="タイトル・アーティスト・タグ・投稿日で検索">
          </div>
          <button class="btn-icon" id="btn-new-playlist" data-tooltip="再生リストを作成">
            <svg data-lucide="list-plus"></svg>
          </button>
          <button class="btn-icon" id="btn-add-files" data-tooltip="ファイルを追加">
            <svg data-lucide="upload"></svg>
          </button>
        </div>

        <!-- Playlist tabs (7) + select mode (8) -->
        <div class="playlist-tabs-row">
          <div class="playlist-tabs-scroll">
            <div id="playlist-tabs"></div>
          </div>
          <button class="btn-icon" id="btn-select-mode" style="flex-shrink:0;margin:0 4px" data-tooltip="複数選択">
            <svg data-lucide="check-square"></svg>
          </button>
        </div>

        <!-- Sort row (9)(10) -->
        <div class="sort-row">
          <button class="btn-sort" id="btn-sort">
            <svg data-lucide="arrow-up-down"></svg>
            <span id="sort-label">手動順</span>
          </button>
          <button class="btn-icon" id="btn-sort-dir" data-tooltip="昇順 / 降順">
            <svg data-lucide="arrow-up"></svg>
          </button>
        </div>

        <!-- Song list (11) -->
        <div id="player-song-list"></div>

      </div><!-- /#playlist-area -->
    </div><!-- /#screen-player -->

    <!-- ---- Editor Screen ---- -->
    <div id="screen-editor" class="screen">

      <!-- Sub-tabs (14)(15)(16) -->
      <div class="editor-sub-tabs">
        <button class="editor-tab-btn active" data-sub="songs">
          <svg data-lucide="music-2"></svg>
          <span>曲一覧</span>
        </button>
        <button class="editor-tab-btn" data-sub="tags">
          <svg data-lucide="tag"></svg>
          <span>タグ管理</span>
        </button>
        <button class="editor-tab-btn" data-sub="artists">
          <svg data-lucide="user"></svg>
          <span>アーティスト管理</span>
        </button>
      </div>

      <!-- Songs sub-screen -->
      <div id="editor-songs" class="editor-sub-screen active">
        <!-- Search (17) -->
        <div class="editor-toolbar">
          <div class="search-bar" style="flex:1">
            <svg data-lucide="search"></svg>
            <input type="text" id="editor-search" placeholder="タイトル・アーティスト・タグ・投稿日で検索">
          </div>
        </div>
        <!-- Sort / columns (18)(19)(20) -->
        <div class="editor-sort-row">
          <button class="btn-sort" id="editor-btn-sort">
            <svg data-lucide="arrow-up-down"></svg>
            <span>追加日順</span>
          </button>
          <button class="btn-icon" id="editor-btn-sort-dir" data-tooltip="昇順 / 降順">
            <svg data-lucide="arrow-down"></svg>
          </button>
          <button class="btn-columns" id="editor-btn-columns">
            <svg data-lucide="layout-grid"></svg>
            <span>4列</span>
          </button>
        </div>
        <!-- Song grid (21) -->
        <div id="editor-song-grid" class="editor-col-4"></div>
      </div>

      <!-- Tags sub-screen -->
      <div id="editor-tags" class="editor-sub-screen">
        <div class="editor-toolbar">
          <button class="btn btn-primary" id="btn-new-tag">
            <svg data-lucide="plus"></svg>タグを追加
          </button>
        </div>
        <div id="tag-list"></div>
      </div>

      <!-- Artists sub-screen -->
      <div id="editor-artists" class="editor-sub-screen">
        <div class="editor-toolbar">
          <button class="btn btn-primary" id="btn-new-artist">
            <svg data-lucide="plus"></svg>アーティストを追加
          </button>
        </div>
        <div id="artist-list"></div>
      </div>

    </div><!-- /#screen-editor -->

    <!-- ---- Log Screen ---- -->
    <div id="screen-log" class="screen">
      <div class="log-period-tabs">
        <button class="log-period-btn" data-period="today">本日</button>
        <button class="log-period-btn" data-period="week">今週</button>
        <button class="log-period-btn active" data-period="month">今月</button>
        <button class="log-period-btn" data-period="year">今年</button>
        <button class="log-period-btn" data-period="all">全期間</button>
      </div>
      <div id="log-content"></div>
    </div>

    <!-- ---- Settings Screen ---- -->
    <div id="screen-settings" class="screen">
      <div id="settings-content"></div>
    </div>

  </main><!-- /#main-content -->

  <!-- ========== Mini Player (12) ========== -->
  <!-- Portrait: visible between content and nav  -->
  <div id="mini-player">
    <div class="mp-thumb" id="mp-thumb-wrap">
      <img src="" alt="">
      <svg data-lucide="music" width="18" height="18"></svg>
    </div>
    <div class="mp-info">
      <div id="mp-title" class="mp-title">曲が選択されていません</div>
      <div id="mp-artist" class="mp-artist">—</div>
    </div>
    <div class="mp-controls">
      <button class="btn-icon" id="mp-btn-prev" data-tooltip="前の曲">
        <svg data-lucide="skip-back"></svg>
      </button>
      <button class="btn-icon" id="mp-btn-play" data-tooltip="再生 / 停止">
        <svg data-lucide="play"></svg>
      </button>
      <button class="btn-icon" id="mp-btn-next" data-tooltip="次の曲">
        <svg data-lucide="skip-forward"></svg>
      </button>
    </div>
    <!-- Progress line at bottom of mini player -->
    <div class="mp-progress" style="width:0%"></div>
  </div><!-- /#mini-player -->

</div><!-- /#app -->

<!-- Player backdrop (portrait) -->
<div id="player-backdrop"></div>

<!-- Global file drop overlay -->
<div id="global-drop-overlay">
  <div class="drop-message">
    <svg data-lucide="upload-cloud" width="24" height="24"></svg>
    音楽ファイルをドロップして追加
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- ===== External Libraries (loaded before module script) ===== -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>

<!-- ===== App Entry Point (ES module) ===== -->
<script type="module" src="js/main.js"></script>

</body>
</html>
